[project]
name = "tops"
description = 'Tiny open power system simulator'
readme = "README.md"
requires-python = ">=3.10"
license = {file="LICENSE"}
version = "0.4.0"
keywords = []
authors = [
  { name = "Hallvar Haugdal", email = "hallvar.haugdal@sintef.no" },
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "progressbar2",
]

[project.optional-dependencies]
dev = ["ipython"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.3",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "markdown-exec>=1.9",
]

[project.urls]
"Homepage" = "https://github.com/hallvar-h/TOPS"
"Bug Tracker" = "https://github.com/hallvar-h/TOPS/issues"
"Documentation" = "https://hallvar-h.github.io/TOPS/"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation simulations (run with -m slow, or -m \"\" for everything)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
extend-exclude = ["examples/notebooks"]

[tool.ruff.lint]
# Ruff defaults (pyflakes + core pycodestyle errors); no line-length rule.
select = ["E4", "E7", "E9", "F"]
