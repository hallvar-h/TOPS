site_name: TOPS
site_description: >-
  Tiny Open Power System Simulator. Dynamic (RMS) power system simulation,
  power flow and modal analysis in plain Python.
site_author: Hallvar Haugdal

# The address is case-sensitive on GitHub Pages. It is also written in
# pyproject.toml ([project.urls]) and README.md; change them together.
site_url: https://hallvar-h.github.io/TOPS/

repo_url: https://github.com/hallvar-h/TOPS
repo_name: hallvar-h/TOPS
edit_uri: edit/main/docs/

copyright: >-
  TOPS is written by Hallvar Haugdal. It was developed at NTNU as part of his
  PhD and is maintained and developed further at SINTEF Energy Research.

theme:
  name: material
  icon:
    logo: material/transmission-tower
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

# Included into pages with --8<--, not pages of their own.
exclude_docs: |
  snippets/

extra_css:
  - stylesheets/sintef.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        # Runs a block marked exec="on" and shows what it prints; every other
        # python block is highlighted as usual.
        - name: python
          class: python
          validator: !!python/name:markdown_exec.validator
          format: !!python/name:markdown_exec.formatter
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # The existing docstrings use the reST ":param x:" style.
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            # Most of TOPS has no docstrings yet; still list the signatures.
            show_if_no_docstring: true
            filters: ["!^_"]
            heading_level: 2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hallvar-h/TOPS
      name: TOPS on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tops/
      name: TOPS on PyPI

nav:
  - Home: index.md
  - Getting started:
      - Install: start/install.md
      - Quickstart: start/quickstart.md
      - Included test systems: start/test-systems.md
  - Guide:
      - Model format: guide/model-format.md
      - Running a simulation: guide/simulation.md
      - Events: guide/events.md
      - Modal analysis: guide/modal-analysis.md
      - Dynamic models: guide/dyn-models.md
      - User-defined models: guide/user-models.md
      - Examples: guide/examples.md
  - API reference:
      - Overview: api/index.md
      - PowerSystemModel: api/dynamic.md
      - Simulator: api/simulator.md
      - Events: api/events.md
      - Model data: api/model-data.md
      - Solvers: api/solvers.md
      - Modal analysis: api/modal-analysis.md
      - Plotting: api/plotting.md
      - Dynamic models: api/dyn-models.md
      - Blocks: api/blocks.md
  - About: about.md
