name: Docs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_MKDOCS_2_WARNING: "1"

    steps:
    - uses: actions/checkout@v6
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync --locked --group docs
    # --strict fails on broken links and unresolved API references. The
    # executed code blocks also fail the build if an example raises.
    - name: Build
      run: uv run mkdocs build --strict
    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - name: Upload a reviewable copy
      uses: actions/upload-artifact@v7
      with:
        name: site-preview
        path: site
        if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    # Only pushes to main publish. Requires Settings > Pages > Source:
    # "GitHub Actions" in the repository.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5
